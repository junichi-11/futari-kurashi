<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MARGIN｜ふたり暮らしの家具とインテリアを静かに選ぶ</title><meta name="description" content="新婚・同棲・ふたり暮らしの家具を、部屋と過ごし方から選ぶMARGINの編集メディア。"><meta name="google-site-verification" content="-Y2NnJCQDyEJVLhpx-12ubly_jrDT5EOgcwjHX19OFI" /><link rel="canonical" href="https://futari-kurashi.vercel.app/"><meta property="og:title" content="MARGIN｜ふたり暮らしの家具と余白。"><meta property="og:description" content="新婚・同棲・ふたり暮らしの家具を、部屋と過ごし方から選ぶ編集メディア。"><meta property="og:type" content="website"><meta property="og:url" content="https://futari-kurashi.vercel.app/"><link rel="stylesheet" href="/assets/discovery.css"></head><body><header class="site-head"><nav class="site-nav wrap" aria-label="サイトナビゲーション"><a class="brand" href="/">MARGIN</a><a href="/articles/">JOURNAL</a></nav></header><main><section class="hero"><div class="wrap"><p class="eyebrow">Furniture for two</p><h1>ふたり暮らしの家具と余白。</h1><p>新婚、同棲、ふたり暮らしの部屋へ。価格だけでは決められない家具選びを、住まいと過ごし方から静かに編集します。</p></div></section><section class="section"><div class="wrap"><div class="section-head"><div><p class="eyebrow">Latest</p><h2>新しい記事</h2></div><a class="section-link" href="/articles/">すべての記事を見る ↗</a></div><div id="latest" class="article-grid latest" aria-live="polite"><p class="status">記事を読み込んでいます。</p></div></div></section><section class="section" id="editors-picks" hidden><div class="wrap"><div class="section-head"><div><p class="eyebrow">Editor's Picks</p><h2>いま、読んでほしい記事</h2></div></div><div id="picks" class="article-grid"></div></div></section><section class="section"><div class="wrap"><div class="section-head"><div><p class="eyebrow">Room Type</p><h2>住まいから探す</h2></div></div><nav id="rooms" class="filter-list" aria-label="住まいから記事を探す"></nav></div></section><section class="section"><div class="wrap"><div class="section-head"><div><p class="eyebrow">Themes</p><h2>家具から探す</h2></div></div><nav id="themes" class="filter-list" aria-label="家具から記事を探す"></nav></div></section></main><footer class="site-footer"><div class="wrap"><nav class="footer-links" aria-label="フッターナビゲーション"><a href="/about/">運営者情報</a><a href="/privacy/">プライバシーポリシー</a><a href="/contact/">お問い合わせ</a><a href="/affiliate-disclosure/">アフィリエイト広告について</a><a href="/disclaimer/">免責事項</a><a href="/articles/">記事一覧</a></nav></div></footer><script src="/assets/article-cards.js" defer></script><script defer>addEventListener("DOMContentLoaded",()=>fetch("/articles/index.json").then(response=>{if(!response.ok)throw new Error();return response.json()}).then(data=>{const all=(data.articles||[]).filter(article=>article.status==="Published").sort((a,b)=>Date.parse(b.updatedAt||b.publishedAt)-Date.parse(a.updatedAt||a.publishedAt));MarginArticleCards.render(document.querySelector("#latest"),all.slice(0,6));if(all.length>3){document.querySelector("#editors-picks").hidden=false;MarginArticleCards.render(document.querySelector("#picks"),all.slice(0,3))}const rooms=[...new Set(all.map(a=>a.roomType).filter(Boolean))];document.querySelector("#rooms").innerHTML=rooms.map(room=>`<a href="/articles/?room=${encodeURIComponent(room)}">${room}</a>`).join("");const labels=[...new Set(all.flatMap(a=>[...(a.editorialThemes||[]),String(a.mainKeyword||"").split(/\s+/).find(word=>/ソファ|テーブル|照明|収納|ミラー|チェア|家電/.test(word))]).filter(Boolean))].slice(0,8);document.querySelector("#themes").innerHTML=labels.map(label=>`<a href="/articles/?theme=${encodeURIComponent(label)}">${label}</a>`).join("")}).catch(()=>document.querySelector("#latest").innerHTML='<p class="status">記事一覧を読み込めませんでした。<a href="/articles/">JOURNALへ</a></p>'))</script></body></html>
