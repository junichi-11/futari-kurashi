マから記事を探す"></nav></div></section></main><footer class="site-footer"><div class="wrap"><nav class="footer-links" aria-label="フッターナビゲーション"><a href="/about/">運営者情報</a><a href="/privacy/">プライバシーポリシー</a><a href="/contact/">お問い合わせ</a><a href="/affiliate-disclosure/">アフィリエイト広告について</a><a href="/disclaimer/">免責事項</a><a href="/articles/">記事一覧</a></nav></div></footer><script src="/assets/article-cards.js" defer></script><script defer>addEventListener("DOMContentLoaded",()=>fetch("/articles/index.json").then(response=>{if(!response.ok)throw new Error();return response.json()}).then(data=>{const all=(data.articles||[]).filter(article=>article.status==="Published").sort((a,b)=>Date.parse(b.updatedAt||b.publishedAt)-Date.parse(a.updatedAt||a.publishedAt));MarginArticleCards.render(document.querySelector("#latest"),all.slice(0,6));const areas=[...new Set(all.map(a=>a.livingArea).filter(Boolean))];document.querySelector("#areas").innerHTML=areas.map(area=>`<a href="/articles/?area=${encodeURIComponent(area)}">${area}</a>`).join("");const categories=[...new Set(all.map(a=>a.productCategory).filter(Boolean))];document.querySelector("#categories").innerHTML=categories.map(value=>`<a href="/articles/?theme=${encodeURIComponent(value)}">${value}</a>`).join("");const editorial=[...new Set(all.flatMap(a=>a.editorialThemes||[]).filter(value=>/コンパクト|長く使|ナチュラル|モダン|コストバランス/.test(value)))].slice(0,8);document.querySelector("#themes").innerHTML=editorial.map(value=>`<a href="/articles/?theme=${encodeURIComponent(value)}">${value}</a>`).join("")}).catch(()=>document.querySelector("#latest").innerHTML='<p class="status">記事一覧を読み込めませんでした。<a href="/articles/">JOURNALへ</a></p>'))</script></body></html>
