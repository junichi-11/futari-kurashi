<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JOURNAL｜MARGINの記事一覧</title><meta name="description" content="ふたりの暮らしに、余白のある選択を。MARGINの家具・インテリア記事一覧です。"><link rel="canonical" href="https://futari-kurashi.pages.dev/articles/"><style>*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;background:#faf9f6;color:#171714;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif;line-height:1.8}header,main,footer{width:min(1120px,calc(100% - 40px));margin:auto}header,footer{padding:30px 0}.top-nav{display:flex;justify-content:space-between}.brand{letter-spacing:.18em;text-decoration:none}a{color:inherit}.hero{padding:84px 0 74px;border-bottom:1px solid #d9d3c8}.eyebrow,.meta{color:#706b63;font-size:10px;letter-spacing:.13em;text-transform:uppercase}h1{margin:12px 0;font:400 clamp(52px,9vw,108px)/1 "Yu Mincho",serif}.intro{max-width:540px;color:#706b63}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:76px 34px;padding:72px 0}.card{min-width:0}.card>a{text-decoration:none}.media{aspect-ratio:4/3;overflow:hidden;background:#f1eee8}.media img{width:100%;height:100%;object-fit:contain;transition:transform .4s ease}.card:hover img{transform:scale(1.02)}.card h2{font:400 clamp(25px,3vw,38px)/1.35 "Yu Mincho",serif}.description{color:#706b63}.facts{display:flex;flex-wrap:wrap;gap:8px 14px;color:#706b63;font-size:10px}.read{font-size:10px;letter-spacing:.12em}.empty{grid-column:1/-1;padding:60px 0}.footer-nav{display:flex;justify-content:space-between;border-top:1px solid #d9d3c8;padding-top:28px}@media(max-width:680px){.grid{grid-template-columns:1fr;gap:58px}.hero{padding:52px 0}}</style></head><body><header><nav class="top-nav"><a class="brand" href="/">MARGIN</a><span>JOURNAL</span></nav></header><main><section class="hero"><p class="eyebrow">MARGIN JOURNAL</p><h1>Articles</h1><p class="intro">家具を選ぶ前に、ふたりがどんな時間を過ごしたいかを考える。暮らしの場面から選択をほどく、MARGINの編集記事です。</p></section><div id="articles" class="grid" aria-live="polite"><p class="empty">記事を読み込んでいます。</p></div></main><footer><nav class="footer-nav" aria-label="フッターナビゲーション" style="flex-wrap:wrap;gap:12px 24px"><a href="/">MARGINトップへ</a><a href="/about/">運営者情報</a><a href="/privacy/">プライバシーポリシー</a><a href="/contact/">お問い合わせ</a><a href="/affiliate-disclosure/">アフィリエイト広告について</a><a href="/disclaimer/">免責事項</a><span>© MARGIN</span></nav></footer><script>const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));fetch('/articles/index.json').then(response=>{if(!response.ok)throw new Error('load');return response.json()}).then(data=>{const root=document.querySelector('#articles'),articles=(data.articles||[]).filter(a=>a.status==='Published').sort((a,b)=>Date.parse(b.publishedAt)-Date.parse(a.publishedAt));if(!articles.length){root.innerHTML='<p class="empty">公開中の記事はまだありません。</p>';return}root.innerHTML=articles.map(a=>'<article class="card"><a href="'+escapeHtml(a.url)+'"><div class="media">'+(a.thumbnail?'<img src="'+escapeHtml(a.thumbnail)+'" alt="" loading="lazy">':'')+'</div><p class="meta">'+escapeHtml(String(a.publishedAt||'').slice(0,10))+' · '+escapeHtml(a.articleType||'Editorial')+'</p><h2>'+escapeHtml(a.displayTitle)+'</h2><p class="description">'+escapeHtml(a.metaDescription)+'</p><p class="facts"><span>更新 '+escapeHtml(String(a.updatedAt||'').slice(0,10))+'</span><span>'+escapeHtml(a.target||'暮らし')+'</span><span>'+Number(a.productCount||0)+' products</span></p><span class="read">読む ↗</span></a></article>').join('')}).catch(()=>document.querySelector('#articles').innerHTML='<p class="empty">記事一覧を読み込めませんでした。時間をおいて再度お試しください。</p>')</script></body></html>
