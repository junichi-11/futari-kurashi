<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Articles | MARGIN</title><meta name="description" content="MARGINの記事一覧"><style>body{margin:0;background:#faf9f6;color:#171714;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif}header,main,footer{width:min(1100px,calc(100% - 40px));margin:auto}header,footer{padding:32px 0}a{color:inherit}.brand{letter-spacing:.18em;text-decoration:none}.hero{padding:80px 0}h1{font:400 clamp(48px,8vw,96px)/1.1 "Yu Mincho",serif}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:64px 32px}.card{border-top:1px solid #d9d3c8;padding-top:20px}.card img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#f1eee8}.card a{text-decoration:none}.meta{font-size:11px;color:#706b63}.empty{padding:60px 0;border-top:1px solid #d9d3c8}@media(max-width:640px){.grid{grid-template-columns:1fr}.hero{padding:48px 0}}html,body{max-width:100%;overflow-x:hidden}</style></head><body><header><a class="brand" href="/">MARGIN</a></header><main><section class="hero"><p class="meta">MARGIN JOURNAL</p><h1>Articles</h1></section><div id="articles" class="grid"></div></main><footer>© MARGIN</footer><script>fetch('/articles/index.json').then(r=>r.json()).then(data=>{const root=document.querySelector('#articles');if(!data.articles.length){root.innerHTML='<p class="empty">記事は準備中です。</p>';return}root.innerHTML=data.articles.map(a=>'<article class="card"><a href="'+a.url+'">'+(a.thumbnail?'<img src="'+a.thumbnail.replace(/[&<>"']/g,'')+'" alt="">':'')+'<p class="meta">'+a.publishedAt.slice(0,10)+' · '+(a.articleType||'Editorial')+'</p><h2>'+a.displayTitle.replace(/[&<>]/g,'')+'</h2><p>'+a.metaDescription.replace(/[&<>]/g,'')+'</p><small>'+a.productCount+' products</small></a></article>').join('')}).catch(()=>document.querySelector('#articles').innerHTML='<p class="empty">記事一覧を読み込めませんでした。</p>')</script></body></html>
